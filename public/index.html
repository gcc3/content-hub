<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      The shell every page is built from. src/build/prerender.js reads this file,
      fills the block below with the title, description and structured data for
      one page, drops that page's markup into #root, and writes the result to
      public/.prerender/. Left as it is, this is the fallback the server sends
      when a prerendered page is missing.
    -->
    <!-- head:start -->
    <title>gcc³</title>
    <!-- head:end -->

    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="global.css" />
    <!-- Written by the production build, so the prerendered HTML arrives
         styled. In development style-loader injects the same rules instead. -->
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
